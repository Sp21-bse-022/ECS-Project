<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECS Learning App — Frontend</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b1220;
    color: #e8edf3;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px;
  }
  main { max-width: 520px; width: 100%; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p.sub { color: #8fa1b8; margin: 0 0 24px; }
  label { display: block; font-size: 0.8rem; color: #8fa1b8; margin-bottom: 6px; }
  .row { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] {
    flex: 1;
    background: #121b2c;
    border: 1px solid #2a3a54;
    color: #e8edf3;
    padding: 10px 12px;
    border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 0.85rem;
  }
  button {
    background: #ff9f43;
    color: #241200;
    border: none;
    padding: 10px 14px;
    border-radius: 4px;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .actions button { background: #1a2740; color: #e8edf3; border: 1px solid #2a3a54; }
  pre {
    background: #121b2c;
    border: 1px solid #2a3a54;
    border-radius: 4px;
    padding: 14px;
    font-size: 0.8rem;
    overflow-x: auto;
    min-height: 60px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .status { font-size: 0.78rem; color: #8fa1b8; margin-bottom: 8px; }
</style>
</head>
<body>
<main>
  <h1>🚢 ECS Learning App</h1>
  <p class="sub">Static frontend on S3, calling the Express backend running on ECS.</p>

  <label for="backend-url">Backend URL</label>
  <div class="row">
    <input type="text" id="backend-url" placeholder="http://<ecs-task-public-ip>:3968">
    <button id="save-btn">Save</button>
  </div>

  <div class="actions">
    <button data-path="/">GET /</button>
    <button data-path="/health">GET /health</button>
    <button data-path="/api/info">GET /api/info</button>
  </div>

  <div class="status" id="status">No request made yet.</div>
  <pre id="output">—</pre>
</main>

<script>
  const urlInput = document.getElementById("backend-url");
  const statusEl = document.getElementById("status");
  const outputEl = document.getElementById("output");
  const STORAGE_KEY = "ecs-learning-backend-url";

  urlInput.value = localStorage.getItem(STORAGE_KEY) || "";

  document.getElementById("save-btn").addEventListener("click", () => {
    localStorage.setItem(STORAGE_KEY, urlInput.value.trim());
    statusEl.textContent = "Saved backend URL.";
  });

  document.querySelectorAll(".actions button").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const base = urlInput.value.trim().replace(/\/$/, "");
      if (!base) {
        statusEl.textContent = "Set a backend URL first.";
        return;
      }
      const path = btn.dataset.path;
      statusEl.textContent = `Requesting ${base}${path} …`;
      outputEl.textContent = "—";
      try {
        const res = await fetch(base + path);
        const text = await res.text();
        statusEl.textContent = `${base}${path} → HTTP ${res.status}`;
        try {
          outputEl.textContent = JSON.stringify(JSON.parse(text), null, 2);
        } catch {
          outputEl.textContent = text;
        }
      } catch (err) {
        statusEl.textContent = `Request failed: ${err.message}`;
        outputEl.textContent = "Check the URL, the task's security group, and CORS_ORIGIN on the backend.";
      }
    });
  });
</script>
</body>
</html>
